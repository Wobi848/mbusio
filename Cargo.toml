[package]
name = "mbusio"
version = "0.5.0"
edition = "2021"
description = "M-Bus Master mit Weboberfläche: Scan, Auslesen, Adressierung, Export"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
fs4 = "0.13"
mime_guess = "2"
# schon über rustls im Lock; eigene Nutzung für die verschlüsselte Sicherung (AES-256-GCM, PBKDF2)
ring = "0.17"
# Sicherungs-Passwort im Kopf X-Backup-Password (Umlaute prozent-kodiert); kommt ohnehin mit axum
percent-encoding = "2"
# SQLite fest eingebaut: keine Systembibliothek nötig, auch nicht auf Windows oder dem Pi
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ohne libudev, damit Cross-Compile (Raspberry Pi, Windows) ohne Systembibliotheken klappt
serialport = { version = "4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
# Ströme für Server-Sent Events (Node-RED); kommt ohnehin mit axum
futures-util = "0.3"
webpki-roots = "1"

# nur unter Windows: als Dienst laufen (Konzept Hintergrund), Energiesparmodus verhindern
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
# Absturz beendet mbusio ganz: systemd (Restart=on-failure) bzw. der Windows-Dienst starten es neu,
# statt dass es mit gesperrter Datenbank (vergifteter Mutex) halb weiterläuft
panic = "abort"

# nur beim Bauen unter Windows: Icon in die .exe (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
