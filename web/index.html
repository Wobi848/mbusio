<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>mbusio</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/meter.css">
<link rel="stylesheet" href="css/plot.css">
<link rel="stylesheet" href="app/app.css">
<script src="js/theme.js"></script>
</head>
<body>

<aside class="side">
<header class="bar top" aria-label="mbusio">
  <span class="brand" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8h18M3 16h18"/><circle cx="8" cy="8" r="2.2" fill="var(--surface)"/><circle cx="16" cy="16" r="2.2" fill="var(--surface)"/></svg>
    mbusio
  </span>
  <div class="path">
    <select id="project" data-title="project"></select>
    <span class="sep" aria-hidden="true">›</span>
    <div class="menu-host">
      <button id="line" type="button" class="field" aria-haspopup="menu" aria-expanded="false" data-title="line"></button>
      <div id="line-menu" class="menu" role="menu" hidden></div>
    </div>
  </div>
  <div class="conn menu-host">
    <span id="conn-state" class="state"></span>
    <button id="conn-action" type="button"></button>
    <div id="conn-form" class="menu form" hidden></div>
  </div>
  <label id="op" class="op"><input id="op-switch" type="checkbox" class="switch"><b data-t="op_chip"></b><span id="op-text" class="sub"></span></label>
  <div class="menu-host push">
    <button id="op-all" type="button" class="plain" aria-haspopup="menu" aria-expanded="false" hidden></button>
    <div id="op-all-menu" class="menu end" role="menu" hidden></div>
  </div>
  <div class="menu-host">
    <button id="settings" type="button" class="quiet" aria-haspopup="menu" aria-expanded="false" data-title="settings">⚙ <span class="side-label" data-t="settings_short"></span></button>
    <div id="settings-menu" class="menu end form" hidden>
      <label class="row"><span data-t="language"></span><select id="lang"></select></label>
      <label class="row"><span data-t="theme"></span><select id="theme"><option value="auto" data-t="theme_auto_short"></option><option value="light" data-t="theme_light_short"></option><option value="dark" data-t="theme_dark_short"></option></select></label>
      <label class="row"><span data-t="help_toggle"></span><input type="checkbox" id="help-toggle"></label>
      <fieldset id="storage" class="storage">
        <label class="row"><span data-t="st_protect"></span><input type="checkbox" name="protect"></label>
        <label class="row"><span data-t="st_first"></span><span><input type="number" name="first_days" min="30" class="mono"> <span data-t="st_days"></span></span></label>
        <label class="row"><span data-t="st_second"></span><span><input type="number" name="second_days" min="30" class="mono"> <span data-t="st_days"></span></span></label>
        <p class="sub" data-t="st_hint"></p>
      </fieldset>
      <fieldset class="backup">
        <span data-t="bk_title"></span>
        <span class="acts"><a id="backup-get" class="quiet" download data-t="bk_download"></a><button id="backup-pick" type="button" class="quiet" data-t="bk_restore"></button></span>
        <input id="backup-file" type="file" accept=".db,application/vnd.sqlite3" hidden>
        <p class="sub" data-t="bk_hint"></p>
      </fieldset>
      <button id="keys-help" type="button" class="quiet" data-t="n_keys"></button>
    </div>
  </div>
</header>

<!-- Gruppen: einrichten | Arbeitsablauf (in dieser Reihenfolge) | Hilfsmittel -->
<nav class="bar tabs" aria-label="Bereiche">
  <div class="tab-scroll">
  <span class="tab-group"><a href="#/overview" data-area="uebersicht"><span data-t="tab_overview"></span></a></span>
  <span class="tab-sep" aria-hidden="true"></span>
  <span class="tab-group"><a href="#/site" data-area="anlage"><span data-t="tab_project"></span></a></span>
  <span class="tab-sep" aria-hidden="true"></span>
  <span class="tab-group">
    <a href="#/scan" data-area="scan"><span data-t="tab_scan"></span></a>
    <a href="#/meters" data-area="zaehler"><span data-t="tab_meters"></span> <span class="n" id="n-meters"></span></a>
    <a href="#/transfer" data-area="weitergabe"><span data-t="tab_transfer"></span> <span class="n" id="n-dp"></span></a>
  </span>
  <span class="tab-sep" aria-hidden="true"></span>
  <span class="tab-group">
    <a href="#/tools" data-area="werkzeuge"><span data-t="tab_tools"></span></a>
    <a href="#/simulator" data-area="simulator" id="tab-sim"><span data-t="tab_sim"></span></a>
  </span>
  </div>
</nav>
</aside>

<div class="content">
<div class="nextbar"><p id="next-why" hidden></p><button id="next" type="button" hidden></button></div>

<main id="work" class="work"></main>

<section id="console" class="console" aria-label="Bus" hidden>
  <div class="chead"><b data-t="n_console"></b><span id="console-state" class="sub cut"></span><span class="grow"></span>
    <a href="#/tools" class="quiet" data-t="n_console_tools"></a>
    <button id="console-close" type="button" class="icon" data-title="close">×</button></div>
  <div id="console-log" class="buslog mono"></div>
</section>

<section id="warnpanel" class="console warnpanel" hidden>
  <div class="chead"><b data-t="n_warn_title"></b><span class="grow"></span>
    <a href="#/transfer/email" class="quiet" data-t="n_warn_settings"></a>
    <button id="warn-seen-all" type="button" class="quiet" data-t="n_warn_seen_all"></button>
    <button id="warn-close" type="button" class="icon" data-title="close">×</button></div>
  <div id="warn-list" class="warnlist"></div>
</section>

<footer class="bar status" aria-live="polite">
  <button id="bus" type="button" class="state" aria-expanded="false" aria-controls="console" data-title="n_bus_title"></button>
  <span id="issues"></span>
  <span id="warnings"></span>
  <span id="outputs"></span>
</footer>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="js/texts.js"></script>
<script src="js/base.js"></script>
<script src="js/icons.js"></script>
<script src="js/scanlogic.js"></script>
<script src="js/plot.js"></script>
<script src="js/listlogic.js"></script>
<script type="module" src="app/app.js"></script>
</body>
</html>
